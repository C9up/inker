# PATTERN: copy-and-rename for 55.2/55.3/55.4 — Rust hot-path packages.
name: inker-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_overwrite:
        description: 'Type YES to override the drift gate (force-publish even if registry version >= package.json version). Use only for rollback scenarios.'
        required: false
        default: 'no'

permissions:
  contents: read

concurrency:
  # Differentiated by event_name so a workflow_dispatch publish run is not
  # cancelled by a subsequent push to main mid-flight.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:

  # Typecheck + lint quality gate — one ubuntu run (no matrix). Mirrors the
  # aggregate `verify:all` gate at the ream-dev root so a standalone clone of
  # this package enforces the same bar.
  quality:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with: { version: 9 }
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec tsc -p tsconfig.build.json --noEmit
      - run: pnpm lint
  # Native-runner build matrix. No cross-compilation — each runner produces the
  # binary for its own platform via `pnpm build:napi` (cargo + scripts/copy-napi.mjs).
  # Inker's TS suite (~200 facade/integration tests + the byte-parity smoke from
  # 55.1; the lex/parse/render behaviours now live in the Rust crate's own test
  # suite) re-asserts that templates round-trip via NAPI on each platform.
  build-and-test:
    name: Build & test (${{ matrix.suffix }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    suffix: linux-x64-gnu,   target: x86_64-unknown-linux-gnu,  test: true, coverage: true }
          - { os: ubuntu-24.04-arm, suffix: linux-arm64-gnu, target: aarch64-unknown-linux-gnu, test: true }
          # darwin-x64 cross-compiled on arm64 (macos-13 Intel runners are scarce);
          # build-only — an x86_64 .node can't be loaded/tested on the arm64 runner.
          - { os: macos-14,         suffix: darwin-x64,      target: x86_64-apple-darwin,       test: false }
          - { os: macos-14,         suffix: darwin-arm64,    target: aarch64-apple-darwin,      test: true }
          - { os: windows-latest,   suffix: win32-x64-msvc,  target: x86_64-pc-windows-msvc,    test: true }
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with: { version: 9 }
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install

      - name: Build NAPI binary
        run: pnpm build:napi
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}

      - name: Vitest (+ v8 coverage gate on x64)
        if: matrix.test
        # Tests run on EVERY matrix leg (NAPI-loaded branch) and write the JSON
        # for the smoke gate below. The v8 COVERAGE threshold is enforced only on
        # the linux-x64 leg (matrix.coverage) — v8 branch-counting differs by CPU
        # arch, so gating coverage per-arch is fragile with zero added value; the
        # arm64/win legs still verify the native binary loads and all tests pass.
        run: pnpm exec vitest run ${{ matrix.coverage && '--coverage' || '' }} --reporter=default --reporter=json --outputFile=test-results.json
        shell: bash

      - name: Smoke gate — tests ran AND zero skipped (Linux/macOS)
        if: matrix.test && runner.os != 'Windows'
        run: |
          if [ ! -f test-results.json ]; then
            echo "::error::test-results.json not produced — pnpm test failed before writing"
            exit 1
          fi
          total=$(jq '[.testResults[].assertionResults[]] | length' test-results.json)
          if [ "$total" -eq 0 ]; then
            echo "::error::0 tests ran — test discovery is broken (check vitest include glob)"
            exit 1
          fi
          skipped=$(jq '[.testResults[].assertionResults[] | select(.status=="skipped")] | length' test-results.json)
          if [ "$skipped" -ne 0 ]; then
            echo "::error::$skipped tests skipped — check NAPI binary load path"
            exit 1
          fi
        shell: bash

      - name: Smoke gate — tests ran AND zero skipped (Windows)
        if: matrix.test && runner.os == 'Windows'
        run: |
          if (-not (Test-Path test-results.json)) {
            Write-Error "test-results.json not produced — pnpm test failed before writing"
            exit 1
          }
          $total = python -c "import json,sys; d=json.load(open(sys.argv[1])); print(sum(1 for r in d['testResults'] for a in r['assertionResults']))" test-results.json
          if ([int]$total -eq 0) {
            Write-Error "0 tests ran — test discovery is broken (check vitest include glob)"
            exit 1
          }
          $skipped = python -c "import json,sys; d=json.load(open(sys.argv[1])); print(sum(1 for r in d['testResults'] for a in r['assertionResults'] if a['status']=='skipped'))" test-results.json
          if ([int]$skipped -ne 0) {
            Write-Error "$skipped tests skipped — check NAPI binary load path"
            exit 1
          }
        shell: pwsh

      - name: Upload artefact
        uses: actions/upload-artifact@v7
        with:
          name: inker-napi-${{ matrix.suffix }}
          path: index.${{ matrix.suffix }}.node
          if-no-files-found: error

  # Rust-side unit tests. Single platform — the Rust logic is platform-
  # independent. Tests both the `inker-engine` crate (lex / parse / render
  # logic, 107 tests at 55.1 close) and `inker-engine-napi` (the NAPI wrapper)
  # so any regression at either layer surfaces immediately.
  cargo-tests:
    name: Cargo tests (linux-x64-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  # Publish job — DORMANT for 55.1 per D55.1.6. Lands but stays gated on
  # workflow_dispatch only (manual maintainer click). NPM_TOKEN required.
  # Will activate when the maintainer decides Inker is ready for npm publish.
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality, build-and-test, cargo-tests]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with: { version: 9 }
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Verify NPM_TOKEN secret
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::error::NPM_TOKEN secret missing — set in repo settings before manual publish"
            exit 1
          fi

      - name: Tag-vs-package.json gate
        run: |
          tag=$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -z "$tag" ]; then
            echo "::error::HEAD has no v<MAJOR>.<MINOR>.<PATCH>-shaped tag — refuse to publish from an untagged commit"
            exit 1
          fi
          node_err=$(mktemp)
          if ! pkg_v=$(node -p "require('./package.json').version" 2>"$node_err"); then
            echo "::error::Failed to read package.json version: $(cat "$node_err")"
            rm -f "$node_err"; exit 1
          fi
          rm -f "$node_err"
          if [ -z "$pkg_v" ]; then
            echo "::error::package.json version field is empty"
            exit 1
          fi
          pkg_tag="v${pkg_v}"
          if [ "$tag" != "$pkg_tag" ]; then
            echo "::error::Tag $tag does not match package.json $pkg_tag — refuse to publish from a drifted tag"
            exit 1
          fi
          echo "Tag gate passed: $tag == $pkg_tag"

      - name: Drift fail-closed gate
        env:
          CONFIRM_OVERWRITE: ${{ inputs.confirm_overwrite }}
        run: |
          node_err=$(mktemp)
          if ! local_v=$(node -p "require('./package.json').version" 2>"$node_err"); then
            echo "::error::Failed to read package.json version: $(cat "$node_err")"
            rm -f "$node_err"; exit 1
          fi
          rm -f "$node_err"
          if [ -z "$local_v" ]; then
            echo "::error::package.json version field is empty"
            exit 1
          fi
          npm_err=$(mktemp)
          # `if` form so `set -e` (bash -e) does not abort the step when
          # `npm view` exits non-zero (e.g. E404 on a first publish) — a bare
          # assignment would die before `status=$?` and skip the E404 path.
          if npm_v=$(npm view --fetch-timeout=30000 @c9up/inker version 2>"$npm_err"); then
            status=0
          else
            status=$?
          fi
          err=$(cat "$npm_err"); rm -f "$npm_err"
          if [ "$status" -ne 0 ]; then
            if echo "$err" | grep -qE 'E404|404 Not Found'; then
              npm_v=""
              echo "Drift gate: package not yet on registry — first-publish path"
            else
              echo "::error::Cannot reach npm registry — refuse to publish without a verified registry version. Output: $err"
              exit 1
            fi
          fi
          if [ -z "$npm_v" ]; then
            echo "Drift gate passed: first publish of @c9up/inker (local $local_v)"
            exit 0
          fi
          highest=$(printf '%s\n%s\n' "$npm_v" "$local_v" | sort -V | tail -1)
          if [ "$local_v" = "$npm_v" ]; then
            if [ "$CONFIRM_OVERWRITE" != "YES" ]; then
              echo "::error::Local version $local_v already published — bump package.json or re-run with confirm_overwrite=YES (rollback path)"
              exit 1
            fi
            echo "Override accepted: republishing $local_v over registry $npm_v"
          elif [ "$highest" = "$npm_v" ]; then
            if [ "$CONFIRM_OVERWRITE" != "YES" ]; then
              echo "::error::Registry version $npm_v is newer than local $local_v — refuse to roll back without confirm_overwrite=YES"
              exit 1
            fi
            echo "Override accepted: rolling back from $npm_v to $local_v"
          else
            echo "Drift gate passed: local $local_v > registry $npm_v"
          fi

      - run: pnpm install
      - uses: actions/download-artifact@v7
        with:
          pattern: inker-napi-*
          merge-multiple: true
      - run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
