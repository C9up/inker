[package]
name = "inker-engine-napi"
version = "0.1.7"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi4", "serde-json"] }
napi-derive = { version = "2", features = ["type-def"] }
inker-engine = { path = "../inker-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
napi-build = "2"
